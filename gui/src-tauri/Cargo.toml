[package]
name = "claudebuild-gui"
version = "2.0.0"
description = "ClaudeBuild GUI - Visual interface for multi-agent orchestration"
authors = ["ClaudeBuild Team"]
license = "MIT"
repository = "https://github.com/claudebuild/claudebuild"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-all", "fs-all", "path-all", "process-all", "notification-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]